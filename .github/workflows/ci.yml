name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # gitleaks-action がコミット差分をスキャンするのに必要
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: npm audit
        run: npm audit --audit-level=low
      - run: npm run typecheck
      # Next 16 の next build は lint を実行しない。このステップが無いと
      # lint がどこでも走らない（acro-finder と同じ理由で追加）。
      - run: npm run lint
      - run: npm run coverage
      - run: npm run build
      - name: Lighthouse regression guard
        run: |
          npm start & disown
          timeout 30 bash -c 'until curl -sf http://localhost:3000/ja >/dev/null; do sleep 1; done'
          node scripts/lighthouse-ci.mjs
