name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for GITHUB_TOKEN: the job only reads the repository
# (gitleaks-action reads the PR commit list).
permissions:
  contents: read
  pull-requests: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # needed for gitleaks-action to scan the commit range
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: gitleaks scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: npm audit
        run: node scripts/audit-gate.mjs
      - run: npm run typecheck
      # Next 16's next build does not run lint. Without this step lint
      # runs nowhere (added for the same reason as in acro-finder).
      - run: npm run lint
      - run: npm run coverage
      - run: npm run build
      - name: Lighthouse regression guard
        run: |
          npm start & disown
          timeout 30 bash -c 'until curl -sf http://localhost:3000/ja >/dev/null; do sleep 1; done'
          node scripts/lighthouse-ci.mjs
