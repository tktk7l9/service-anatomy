name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for GITHUB_TOKEN: the job only reads the repository
# (gitleaks-action reads the PR commit list).
permissions:
  contents: read
  pull-requests: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # needed for gitleaks-action to scan the commit range
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: gitleaks scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: npm audit
        run: node scripts/audit-gate.mjs
      - run: npm run typecheck
      # Next 16's next build does not run lint. Without this step lint
      # runs nowhere (added for the same reason as in acro-finder).
      - run: npm run lint
      - run: npm run coverage
      - run: npm run build
      - name: Lighthouse regression guard
        run: |
          npm start & disown
          timeout 30 bash -c 'until curl -sf http://localhost:3000/ja >/dev/null; do sleep 1; done'
          node scripts/lighthouse-ci.mjs
