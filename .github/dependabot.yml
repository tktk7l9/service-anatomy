version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # typescript-eslint / eslint-plugin-react, bundled by eslint-config-next,
      # do not support TypeScript 7 or ESLint 10 yet, so hold these two major updates.
      #   typescript-eslint does not support TS 7.0
      #     https://github.com/typescript-eslint/typescript-eslint/issues/10940
      #   eslint-plugin-react: contextOrFilename.getFilename is not a function (ESLint 10)
      # Remove this ignore once upstream catches up. minor/patch and other packages' majors still go through.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
      npm-major:
        update-types:
          - "major"
